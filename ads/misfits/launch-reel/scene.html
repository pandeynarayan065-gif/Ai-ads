     Open: the camera dives in as a lime scan line wakes the feed. A feed of identical ad cards scrolls; one card
     turns lime and tilts off-axis (the misfit) and lights up the cards around it; the rest fall away; it cycles
     through product silhouettes ("your product"); then it locks into the Misfits symbol and the end card.
     v2: bloom glow, bevelled tiles, lime point light, particles, gradient sky, bigger type with gradient + glow. -->

<script type="module">
import * as THREE from "three";

const S=new THREE.Scene(); S.fog=new THREE.Fog(0x0a0c0d,8,30);
// gradient sky: deep ink with a lime horizon glow (screen-space background)
{const c=document.createElement("canvas");c.width=270;c.height=480;const g=c.getContext("2d");
  const l=g.createLinearGradient(0,0,0,480);l.addColorStop(0,"#050607");l.addColorStop(.55,"#0b0e0c");l.addColorStop(1,"#07080a");g.fillStyle=l;g.fillRect(0,0,270,480);
  const r=g.createRadialGradient(135,170,0,135,170,220);r.addColorStop(0,"#26401a");r.addColorStop(.5,"#11180e");r.addColorStop(1,"#0000");g.fillStyle=r;g.fillRect(0,0,270,480);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;S.background=t;}
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,120);
const hemi=new THREE.HemisphereLight(0xdfe8ff,0x0b0c0a,1.1); S.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(-4,-6,12); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.radius=4; Object.assign(key.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});
const rim=new THREE.DirectionalLight(0x9fdcff,0.9); rim.position.set(6,30,4);
S.add(key,key.target,rim);
const limeL=new THREE.PointLight(C.fit,0,7,1.6); S.add(limeL);           // the misfit lights up its neighbours
const scanL=new THREE.PointLight(C.fit,0,5,1.8); S.add(scanL);

const comp=new EffectComposer(R,new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType,samples:4}));
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.6,0.5,0.72); comp.addPass(bloom);

// ---------- textures ----------
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
const HEAD=["New collection is here","SALE · up to 20% off","Limited time offer","Shop now, pay later",
  "Quality you can trust","Free shipping today","Upgrade your routine","Don’t miss out"];
const BR=["brandname.co","shop_official","the_store","bestdeals.in","yourbrand","officialstore","brand.world","shopnow"];
function tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function cardTex(i){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  g.fillStyle="#15171c";rr(g,0,0,512,512,56);g.fill();
  g.fillStyle="#2a2e36";g.beginPath();g.arc(58,56,22,0,7);g.fill();
  g.fillStyle="#9a9fa8";g.font='600 24px Inter';g.fillText(BR[i%8],94,52);
  g.fillStyle="#5d626b";g.font='500 18px Inter';g.fillText("Sponsored",94,76);
  const gr=g.createLinearGradient(0,100,0,360);gr.addColorStop(0,"#252830");gr.addColorStop(1,"#1b1e24");
  g.fillStyle=gr;rr(g,28,100,456,250,18);g.fill();
  g.fillStyle="#30343c";rr(g,186,170,140,110,14);g.fill();
  g.fillStyle="#b9bdc4";g.font='700 30px Inter';g.fillText(HEAD[(i*3)%8],32,400);
  g.strokeStyle="#4a4f58";g.lineWidth=3;rr(g,32,428,160,52,26);g.stroke();
  g.fillStyle="#9a9fa8";g.font='600 22px Inter';g.fillText("Shop now",64,462);
  return tex(c);}
function solidTex(a,b){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  const l=g.createLinearGradient(0,0,512,512);l.addColorStop(0,a);l.addColorStop(1,b);g.fillStyle=l;rr(g,0,0,512,512,56);g.fill();return tex(c);}
// vector product silhouettes on the lime face (generic shapes: "your product")
function silTex(kind){const c=document.createElement("canvas");c.width=c.height=1024;const g=c.getContext("2d");
  const l=g.createLinearGradient(0,0,1024,1024);l.addColorStop(0,"#c6ff5e");l.addColorStop(1,"#7cc23c");g.fillStyle=l;rr(g,0,0,1024,1024,112);g.fill();
  g.save();g.translate(512,520);g.scale(1.3,1.3);g.fillStyle="#08090b";
  const hi=(x,y,w,h,r)=>{g.save();g.fillStyle="rgba(198,255,94,.22)";rr(g,x,y,w,h,r);g.fill();g.restore();};
  if(kind==="spray"){rr(g,-125,-80,250,460,48);g.fill();
    g.beginPath();g.moveTo(-125,-20);g.bezierCurveTo(-125,-110,-60,-140,-40,-142);g.lineTo(40,-142);g.bezierCurveTo(60,-140,125,-110,125,-20);g.fill();
    rr(g,-50,-200,100,64,10);g.fill(); rr(g,-66,-232,132,40,12);g.fill(); rr(g,-42,-330,84,104,16);g.fill(); rr(g,38,-312,80,28,9);g.fill();
    hi(-92,-40,24,380,12); g.fillStyle="rgba(198,255,94,.14)";g.fillRect(-125,60,250,150);}
  if(kind==="perfume"){rr(g,-185,-90,370,440,70);g.fill(); rr(g,-36,-140,72,56,8);g.fill(); rr(g,-80,-300,160,166,22);g.fill();
    hi(-140,-50,26,360,13); g.fillStyle="rgba(198,255,94,.16)";rr(g,-110,70,220,120,10);g.fill();}
  if(kind==="can"){rr(g,-130,-300,260,640,46);g.fill(); g.fillStyle="rgba(198,255,94,.2)";g.fillRect(-130,-250,260,6);g.fillRect(-130,280,260,6);
    hi(-96,-230,24,500,12); g.fillStyle="rgba(198,255,94,.14)";g.fillRect(-130,-40,260,140);}
  g.restore();return tex(c);}
const cardT=[...Array(8)].map((_,i)=>cardTex(i)), fitT=solidTex("#c6ff5e","#7cc23c"), paperT=solidTex("#f4f5f0","#d6d7d1");
const silT=["spray","perfume","can"].map(silTex);
// grain overlay (static, keeps the gradient from banding)
{const g=document.getElementById("grain").getContext("2d");const d=g.createImageData(540,960);
  let s=7;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const v=s%255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}

// ---------- tiles ----------
const shape=new THREE.Shape();{const s=0.47,r=0.1;shape.moveTo(-s+r,-s);shape.lineTo(s-r,-s);shape.quadraticCurveTo(s,-s,s,-s+r);

  shape.lineTo(-s,-s+r);shape.quadraticCurveTo(-s,-s,-s+r,-s);}
const body=new THREE.ExtrudeGeometry(shape,{depth:0.12,bevelEnabled:true,bevelThickness:0.03,bevelSize:0.03,bevelSegments:4,curveSegments:8});
body.translate(0,0,-0.15);

  const f=new THREE.Mesh(face,new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:0.4,metalness:0.1}));f.receiveShadow=true;
  g.add(b,f);g.userData.face=f;g.userData.body=b;return g;}
const P=1.12, COLS=5, ROWS=34, HERO={c:2,r:20};
const tiles=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){

const heroBody=hero.userData.body.material;
const fitF=new THREE.Mesh(face,new THREE.MeshStandardMaterial({map:fitT,emissive:0xffffff,emissiveMap:fitT,emissiveIntensity:0,transparent:true,opacity:0,roughness:0.3}));fitF.position.z=0.006;
const silF=silT.map((m,i)=>{const f=new THREE.Mesh(face,new THREE.MeshBasicMaterial({map:m,transparent:true,opacity:0}));f.position.z=0.008+i*0.001;hero.add(f);return f;});
hero.add(fitF);
const symC=heroHome.clone().add(new THREE.Vector3(-0.689,-0.689,1.2));
const SYM=[[-0.611,0.611],[-0.611,-0.611],[0.611,-0.611]];
const mates=SYM.map(([x,y])=>{const t=tile(paperT,0xd9dad4);t.userData.face.material=new THREE.MeshBasicMaterial({map:paperT,transparent:true,color:0xcfd0cb});
  t.userData.target=new THREE.Vector3(symC.x+x,symC.y+y,symC.z);
  t.userData.from=new THREE.Vector3(symC.x+x*6,symC.y+y*6-3,symC.z+9);t.visible=false;S.add(t);return t;});

// scan line that wakes the feed at the start
const scan=new THREE.Mesh(new THREE.PlaneGeometry(9,0.05),new THREE.MeshBasicMaterial({color:0xd8ff9a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
const scanHalo=new THREE.Mesh(new THREE.PlaneGeometry(9,0.9),new THREE.MeshBasicMaterial({color:C.fit,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,
  alphaMap:(()=>{const c=document.createElement("canvas");c.width=4;c.height=64;const g=c.getContext("2d");const l=g.createLinearGradient(0,0,0,64);
  l.addColorStop(0,"#000");l.addColorStop(.5,"#fff");l.addColorStop(1,"#000");g.fillStyle=l;g.fillRect(0,0,4,64);return new THREE.CanvasTexture(c);})()}));
S.add(scan,scanHalo);

// floating particles (dust in the light)
const NP=700, pg=new THREE.BufferGeometry(), pp=new Float32Array(NP*3), pc=new Float32Array(NP*3), seed=[];
let rs=11;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;
for(let i=0;i<NP;i++){seed.push([rnd()*10-5,rnd()*36-6,0.2+rnd()*7,rnd()*6.28,0.2+rnd()*0.5]);
  const lime=rnd()<0.45;pc.set(lime?[0.55,0.83,0.27]:[0.8,0.82,0.8],i*3);}
pg.setAttribute("position",new THREE.BufferAttribute(pp,3));pg.setAttribute("color",new THREE.BufferAttribute(pc,3));
const dot=(()=>{const c=document.createElement("canvas");c.width=c.height=64;const g=c.getContext("2d");const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,"#fff");r.addColorStop(.35,"#ffffff80");r.addColorStop(1,"#0000");g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

// The open is a fast low dive that decelerates into the glide.
const KF=[ // t, pos, target, upBlend(0=z-up oblique, 1=y-up top-down)

 [1.1,[0.2,-1.0,6.6],[0,6.5,0],0],
 [3.0,[0,6.0,8.0],[0,13.4,0],0],
 [5.6,[0,12.4,7.2],[0,19.6,0.3],0],
 [7.6,[1.6,14.8,4.6],[0,heroHome.y,1.0],0],
 [10.4,[1.4,15.0,5.4],[0,heroHome.y+0.9,1.2],0],
 [12.4,[0.2,15.3,6.1],[0,heroHome.y+0.9,1.2],0.25],
 [14.6,[0,symC.y-1.9,16.0],[0,symC.y-1.9,1.2],1],

function herm(i,k,t){const n=KF.length;const g=j=>KF[Math.max(0,Math.min(n-1,j))];

const v=new THREE.Vector3();
