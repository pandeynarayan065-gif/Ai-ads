<!doctype html>
<html><head><meta charset="utf-8">
<!-- Misfits launch reel: one continuous 3D camera move + kinetic type. Rendered frame by frame by render.js.
     The feed of identical ad cards scrolls; one card turns lime and tilts off-axis (the misfit); the rest fall
     away; it shows real client work; then it locks into the Misfits symbol and the end card. -->
<style>
@font-face{font-family:"Arch";src:url("fonts/Archivo-VF.ttf");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Inter";src:url("fonts/Inter-VF.ttf");font-weight:100 900}
:root{--ink:#08090b;--paper:#ecede8;--fit:#8bd346;--mute:#8b9099}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
canvas{position:absolute;inset:0}
.o{position:absolute;left:0;right:0;text-align:center;font-family:"Arch";font-stretch:125%;font-weight:900;
   color:var(--paper);letter-spacing:-1px;opacity:0}
.big{font-size:118px;line-height:1.0}
.w{display:inline-block;opacity:0;margin:0 10px}
.mute{color:var(--mute)}
.fit{color:var(--fit)}
.tilt{display:inline-block;transform:rotate(-14deg) translateY(10px);color:var(--fit)}
#clock{position:absolute;left:64px;top:150px;font:500 34px "Inter";color:var(--mute);letter-spacing:2px}
#clockbig{top:260px}
#clockbig .lbl{font-size:44px;font-weight:600;color:var(--mute);letter-spacing:1px}
#clockbig .num{font-size:300px;color:var(--fit);line-height:1}
#credit{position:absolute;left:0;right:0;top:1640px;text-align:center;font:500 30px "Inter";color:var(--mute);opacity:0}
#mark{top:1180px;font-size:150px}
#tag{top:1380px;font-size:46px;font-weight:600}
#cta{top:1540px}
#cta .pill{display:inline-block;background:var(--fit);color:var(--ink);font-size:52px;padding:26px 54px;border-radius:999px}
#cta .url{display:block;margin-top:28px;font:500 34px "Inter";color:var(--mute);letter-spacing:1px}
</style></head><body>
<div id="clock">00:00</div>
<div class="o big" id="t1" style="top:250px"><span class="w">EVERY</span><span class="w">AD</span><br><span class="w">LOOKS</span><span class="w">THE</span><br><span class="w fit">SAME.</span></div>
<div class="o big" id="t2" style="top:250px"><span class="w">SAME&nbsp;LOOK.</span><br><span class="w">SAME&nbsp;OFFER.</span><br><span class="w mute">SAME&nbsp;FLICK.</span></div>
<div class="o big" id="t3" style="top:250px"><span class="w">THEN&nbsp;ONE</span><br><span class="w">DOESN’T</span><br><span class="w">F<span class="tilt">I</span>T&nbsp;IN.</span></div>
<div class="o" id="clockbig"><div class="lbl">YOU JUST WATCHED THIS FOR</div><div class="num">0:08</div></div>
<div class="o big" id="t5" style="top:230px"><span class="w">IMAGINE</span><span class="w">IT&nbsp;WAS</span><br><span class="w fit">YOUR</span><br><span class="w fit">PRODUCT.</span></div>
<div id="credit">Client work · Spraymax</div>
<div class="o" id="mark">MISF<span class="tilt">I</span>TS</div>
<div class="o" id="tag">ADS THAT DON’T FIT IN.</div>
<div class="o" id="cta"><span class="pill">COMMENT “FILM”</span><span class="url">misfitsagency.in</span></div>
<script type="module">
import * as THREE from "./three.module.js";
const W=1080,H=1920, C={ink:0x08090b,paper:0xecede8,fit:0x8bd346,mute:0x8b9099,card:0x16181d};
await document.fonts.load('900 60px "Arch"'); await document.fonts.load('500 30px "Inter"');

const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H); R.setPixelRatio(1); R.outputColorSpace=THREE.SRGBColorSpace; R.shadowMap.enabled=true;
document.body.prepend(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(C.ink); S.fog=new THREE.Fog(C.ink,9,30);
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,100);
S.add(new THREE.HemisphereLight(0xffffff,0x111111,1.4));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(-4,-6,12); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:40});
S.add(key,key.target);

// ---------- textures ----------
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
const HEAD=["New collection is here","SALE · up to 20% off","Limited time offer","Shop now, pay later",
  "Quality you can trust","Free shipping today","Upgrade your routine","Don’t miss out"];
const BR=["brandname.co","shop_official","the_store","bestdeals.in","yourbrand","officialstore","brand.world","shopnow"];
function cardTex(i){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  g.fillStyle="#16181d";rr(g,0,0,512,512,56);g.fill();
  g.fillStyle="#2a2e36";g.beginPath();g.arc(58,56,22,0,7);g.fill();
  g.fillStyle="#9a9fa8";g.font='600 24px Inter';g.fillText(BR[i%8],94,52);
  g.fillStyle="#5d626b";g.font='500 18px Inter';g.fillText("Sponsored",94,76);
  const gr=g.createLinearGradient(0,100,0,360);gr.addColorStop(0,"#23262d");gr.addColorStop(1,"#1c1f25");
  g.fillStyle=gr;rr(g,28,100,456,250,18);g.fill();
  g.fillStyle="#2f333b";rr(g,186,170,140,110,14);g.fill();           // generic product block
  g.fillStyle="#b9bdc4";g.font='700 30px Inter';g.fillText(HEAD[(i*3)%8],32,400);
  g.strokeStyle="#4a4f58";g.lineWidth=3;rr(g,32,428,160,52,26);g.stroke();
  g.fillStyle="#9a9fa8";g.font='600 22px Inter';g.fillText("Shop now",64,462);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function solidTex(col){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  g.fillStyle=col;rr(g,0,0,512,512,56);g.fill();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
async function imgTex(url){const im=new Image();im.src=url;await im.decode();
  const c=document.createElement("canvas");c.width=c.height=1024;const g=c.getContext("2d");
  g.fillStyle="#8bd346";rr(g,0,0,1024,1024,112);g.fill();
  g.save();rr(g,28,28,968,968,90);g.clip();const s=im.width, y0=(im.height-s)*0.5;g.drawImage(im,0,y0,s,s,28,28,968,968);g.restore();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const cardT=[...Array(8)].map((_,i)=>cardTex(i)), fitT=solidTex("#8bd346"), paperT=solidTex("#ecede8");
const prodT=await imgTex("product.jpg");

// ---------- tiles ----------
const shape=new THREE.Shape();{const s=0.5,r=0.11;shape.moveTo(-s+r,-s);shape.lineTo(s-r,-s);shape.quadraticCurveTo(s,-s,s,-s+r);
  shape.lineTo(s,s-r);shape.quadraticCurveTo(s,s,s-r,s);shape.lineTo(-s+r,s);shape.quadraticCurveTo(-s,s,-s,s-r);
  shape.lineTo(-s,-s+r);shape.quadraticCurveTo(-s,-s,-s+r,-s);}
const body=new THREE.ExtrudeGeometry(shape,{depth:0.08,bevelEnabled:false}); body.translate(0,0,-0.08);
const face=new THREE.PlaneGeometry(1,1); face.translate(0,0,0.002);
function tile(tex,bodyCol=C.card){const g=new THREE.Group();
  const b=new THREE.Mesh(body,new THREE.MeshStandardMaterial({color:bodyCol,roughness:0.6}));b.castShadow=b.receiveShadow=true;
  const f=new THREE.Mesh(face,new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:0.55}));f.receiveShadow=true;
  g.add(b,f);g.userData.face=f;g.userData.body=b;return g;}
const P=1.12, COLS=5, ROWS=34, HERO={c:2,r:20};          // hero card sits in the centre column
const tiles=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const isHero=(c===HERO.c&&r===HERO.r); const t=tile(cardT[(r*7+c*3)%8]);
  t.position.set((c-2)*P,(r-4)*P,0); t.userData.home=t.position.clone();
  // fall order: distance from hero, plus a little hash jitter
  const d=Math.hypot(c-HERO.c,r-HERO.r); t.userData.delay=d*0.07+((r*13+c*7)%5)*0.04; t.userData.spin=((r*5+c*11)%7-3)*0.25;
  if(isHero) continue; S.add(t); tiles.push(t);}
const heroHome=new THREE.Vector3((HERO.c-2)*P,(HERO.r-4)*P,0);
const hero=tile(cardT[0]); hero.position.copy(heroHome); S.add(hero);
const fitF=new THREE.Mesh(face,new THREE.MeshStandardMaterial({map:fitT,transparent:true,opacity:0,roughness:0.45}));fitF.position.z=0.004;
const prodF=new THREE.Mesh(face,new THREE.MeshBasicMaterial({map:prodT,transparent:true,opacity:0}));prodF.position.z=0.006;
hero.add(fitF,prodF);
// the three paper tiles that complete the symbol
const U=100/90*0+1.222, SYM=[[-0.611,0.611],[-0.611,-0.611],[0.611,-0.611]].map(([x,y])=>[x*1.0,y*1.0]);
const symC=heroHome.clone().add(new THREE.Vector3(-0.689,-0.689,1.2));   // hero becomes the top-right misfit
const mates=SYM.map(([x,y],i)=>{const t=tile(paperT,C.paper);t.userData.face.material=new THREE.MeshBasicMaterial({map:paperT,transparent:true});t.userData.target=new THREE.Vector3(symC.x+x,symC.y+y,symC.z);
  t.userData.from=new THREE.Vector3(symC.x+x*6,symC.y+y*6-3,symC.z+9);t.visible=false;S.add(t);return t;});

// ---------- timing helpers ----------
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const ss=x=>x*x*(3-2*x), sm=x=>x*x*x*(x*(x*6-15)+10), eo=x=>1-Math.pow(1-x,3);
const back=x=>{const s=1.9;x-=1;return x*x*((s+1)*x+s)+1;};
const lerp=(a,b,x)=>a+(b-a)*x;

// camera: Catmull-Rom through keyframes with tangents scaled by real time gaps (C1-smooth, one continuous move)
const KF=[ // t, pos, target, upBlend(0=z-up oblique, 1=y-up top-down)
 [0.0,[0,-1.5,8.2],[0,5.5,0],0],
 [3.0,[0,6.8,8.0],[0,14.0,0],0],
 [5.6,[0,12.4,7.2],[0,19.6,0.3],0],
 [7.6,[1.6,14.8,4.6],[0,heroHome.y,1.0],0],
 [10.4,[1.4,15.0,5.4],[0,heroHome.y+0.9,1.2],0],
 [12.4,[0.2,15.3,6.1],[0,heroHome.y+0.9,1.2],0.25],
 [14.6,[0,symC.y-1.9,16.0],[0,symC.y-1.9,1.2],1],
 [18.6,[0,symC.y-1.9,17.0],[0,symC.y-1.9,1.2],1]];
function herm(i,k,t){const n=KF.length;const g=j=>KF[Math.max(0,Math.min(n-1,j))];
  const [t0]=g(i),[t1]=g(i+1),p0=g(i)[k],p1=g(i+1)[k];
  const tan=j=>{if(j===0)return[0,0,0];if(j===n-1)return[0,0,0];const a=g(j-1),b=g(j+1);return a[k].map((v,q)=>(b[k][q]-v)/(b[0]-a[0]));};
  const m0=tan(i),m1=tan(i+1),h=t1-t0,u=(t-t0)/h,u2=u*u,u3=u2*u;
  return p0.map((v,q)=>(2*u3-3*u2+1)*v+(u3-2*u2+u)*h*m0[q]+(-2*u3+3*u2)*p1[q]+(u3-u2)*h*m1[q]);}
function camAt(t){let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;
  const p=herm(i,1,t),q=herm(i,2,t);const ub=lerp(KF[i][3],KF[i+1][3],ss(seg(t,KF[i][0],KF[i+1][0])));
  cam.position.set(...p);cam.up.set(0,ub,1-ub).normalize();cam.lookAt(...q);}

const $=id=>document.getElementById(id);
function words(id,t,t0,step,dur){const el=$(id);const ws=el.querySelectorAll(".w");
  const vis=t>=t0-0.05&&t<t0+dur;el.style.opacity=vis?1:0;
  const out=seg(t,t0+dur-0.25,t0+dur);
  ws.forEach((w,i)=>{const a=seg(t,t0+i*step,t0+i*step+0.22);w.style.opacity=Math.min(eo(a),1-out);
    w.style.transform=`translateY(${(1-back(a))*40-out*30}px) scale(${0.9+0.1*eo(a)})`;});}
function fade(id,t,a,b,dy=30){const el=$(id);const i=eo(seg(t,a,a+0.35)),o=seg(t,b-0.3,b);el.style.opacity=i*(1-o);
  el.style.transform=`translateY(${(1-i)*dy}px)`;}

window.renderAt=function(t){
  camAt(t);
  {const k=sm(seg(t,12.4,14.6));S.fog.near=9+60*k;S.fog.far=30+80*k;}
  // feed is static; camera glides over it. Hero: lime + rise + tilt off-axis at 5.6s
  const lift=back(seg(t,5.55,6.35)), turn=fitF.material;
  turn.opacity=eo(seg(t,5.55,5.8));
  const toSym=sm(seg(t,12.6,14.0));
  const rise=new THREE.Vector3(heroHome.x+0.12*lift,heroHome.y+0.08*lift,1.2*lift + 0.06*Math.sin(t*1.7)*seg(t,6,8)*(1-toSym));
  const symPos=new THREE.Vector3(symC.x+0.689,symC.y+0.689,symC.z);
  hero.position.lerpVectors(rise,symPos,toSym);
  hero.rotation.set(lerp(0.32*lift,0,sm(seg(t,9.6,10.6))),lerp(-0.18*lift,0,sm(seg(t,9.6,10.6))),lerp(-0.244*lift,-0.279,toSym));
  // client work on the misfit tile
  fitF.material.emissive.set(C.fit);fitF.material.emissiveMap=fitT;fitF.material.emissiveIntensity=0.15+0.75*toSym;
  prodF.material.opacity=eo(seg(t,10.5,10.9))*(1-seg(t,12.5,12.9));
  // the rest of the feed falls away, nearest first
  for(const m of tiles){const f=Math.max(0,t-6.9-m.userData.delay);
    m.position.set(m.userData.home.x,m.userData.home.y,-2.2*f*f);m.rotation.set(m.userData.spin*f*0.6,m.userData.spin*f*0.4,0);
    m.visible=m.position.z>-25;}
  // symbol mates fly in
  mates.forEach((m,i)=>{const a=sm(seg(t,12.75+i*0.12,13.75+i*0.12));m.visible=a>0;
    m.position.lerpVectors(m.userData.from,m.userData.target,a);m.rotation.set((1-a)*1.2,(1-a)*-0.8,(1-a)*0.9);});
  key.target.position.copy(hero.position);key.position.set(hero.position.x-4,hero.position.y-6,12);
  R.render(S,cam);
  // ---- type ----
  const s=Math.floor(t);$("clock").textContent=`00:${String(s).padStart(2,"0")}`;
  $("clock").style.opacity=(t<7.9||t>10.3&&t<12.9)?1:0;
  words("t1",t,0.3,0.36,2.2); words("t2",t,2.7,0.75,2.55); words("t3",t,5.6,0.38,1.85);
  fade("clockbig",t,8.0,10.35,0); $("clockbig").querySelector(".num").textContent=`0:${String(s).padStart(2,"0")}`;
  words("t5",t,10.6,0.33,2.1); fade("credit",t,10.8,12.5,10);
  fade("mark",t,13.4,99); fade("tag",t,14.0,99); fade("cta",t,15.6,99);
  const p=eo(seg(t,15.6,16.0));$("cta").querySelector(".pill").style.transform=`scale(${0.8+0.2*back(seg(t,15.6,16.0))})`;
};
window.ready=true;
</script></body></html>
