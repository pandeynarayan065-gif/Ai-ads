<!doctype html><html><head><meta charset="utf-8">
<!-- Highlight cover "Live Reels": 1080x1920 story; Instagram shows the centre as a circle, so the icon sits in the
     middle ~560 px. Icon: the logo's misfit tile (lime, -14deg) with a play mark and a live dot. -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:radial-gradient(42% 24% at 50% 50%,#1b2a12 0%,#0c0f0b 55%,#08090b 100%)}
.c{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px}
.t{position:absolute;inset:0;border-radius:72px;background:linear-gradient(145deg,#c6ff5e,#8bd346 60%,#6fb52f);
  transform:rotate(-14deg);box-shadow:0 0 70px #8bd34680,0 0 160px #8bd34640,inset 0 3px 0 #ffffff70}
.p{position:absolute;left:50%;top:50%;width:0;height:0;margin:-92px 0 0 -58px;border-style:solid;border-width:92px 0 92px 158px;
  border-color:transparent transparent transparent #08090b;transform:rotate(-14deg);transform-origin:40% 50%}
.d{position:absolute;right:-26px;top:-30px;width:86px;height:86px;border-radius:50%;background:#ff3b30;border:12px solid #08090b;box-shadow:0 0 40px #ff3b3099}
</style></head><body><div class="c"><div class="t"></div><div class="p"></div><div class="d"></div></div></body></html>
